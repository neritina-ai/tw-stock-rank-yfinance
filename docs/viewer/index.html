<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股排序策略 Viewer</title>
<style>
:root {
  --bg: #f7f6f2; --panel: #ffffff; --ink: #1b1b19; --ink2: #5b5a55; --muted: #8b8a84;
  --line: #e3e1da; --grid: #ecebe5; --accent: #2f6db5; --bench: #7b7a74;
  --up: #d1453b; --down: #24935a; --score: #8a4fc7;
  --look: rgba(47, 109, 181, 0.09); --next: rgba(230, 160, 40, 0.16);
  --held: rgba(205, 60, 40, 0.85); --cursor: #1b1b19;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --ink2: #b4b3ac; --muted: #85847e;
    --line: #34332f; --grid: #2a2a27; --accent: #6aa3e8; --bench: #9b9a93;
    --up: #f0645a; --down: #3fbf7f; --score: #b98af0;
    --look: rgba(106, 163, 232, 0.12); --next: rgba(240, 180, 60, 0.14);
    --held: rgba(240, 100, 80, 0.9); --cursor: #ecebe6;
  }
}
:root[data-theme="dark"] {
  --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --ink2: #b4b3ac; --muted: #85847e;
  --line: #34332f; --grid: #2a2a27; --accent: #6aa3e8; --bench: #9b9a93;
  --up: #f0645a; --down: #3fbf7f; --score: #b98af0;
  --look: rgba(106, 163, 232, 0.12); --next: rgba(240, 180, 60, 0.14);
  --held: rgba(240, 100, 80, 0.9); --cursor: #ecebe6;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 system-ui, -apple-system, "Segoe UI",
  "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; }
header { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
#tabs { display: flex; flex-wrap: wrap; gap: 4px; }
#tabs button { border: 1px solid var(--line); background: transparent; color: var(--ink2);
  border-radius: 6px; padding: 3px 9px; font: inherit; cursor: pointer; }
#tabs button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
#tabs button kbd { opacity: .55; font-size: 11px; margin-right: 3px; }
#tabs button .tg { font-size: 10.5px; font-weight: 650; border-radius: 999px; padding: 0 5px; margin-left: 4px;
  background: var(--ink); color: var(--panel); }
#tabs button.on .tg { background: var(--panel); color: var(--ink); }
#home { color: var(--ink2); text-decoration: none; font-size: 12.5px; white-space: nowrap; }
#home:hover { color: var(--ink); }
.hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
.hint kbd, .k { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
  padding: 0 4px; font: 11px ui-monospace, monospace; color: var(--ink2); }
#theme { margin-left: auto; border: 1px solid var(--line); background: transparent; color: var(--ink2); border-radius: 6px;
  padding: 3px 8px; cursor: pointer; font: inherit; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(330px, 400px) 1fr; gap: 12px; padding: 12px 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
#left { display: flex; flex-direction: column; overflow: hidden; }
#tradehead { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
#tradehead .date { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
#tradehead .sub { color: var(--ink2); font-size: 12px; }
#legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--ink2); margin-top: 6px; }
#legend i { display: inline-block; width: 46px; height: 9px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
#listwrap { overflow-y: auto; flex: 1; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
#rank th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500;
  font-size: 11px; text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--line); z-index: 1; }
#rank td { padding: 2px 6px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
#rank td.l, #rank th.l { text-align: left; }
#rank tr { cursor: pointer; }
#rank tr.cur td { box-shadow: inset 0 2px 0 var(--cursor), inset 0 -2px 0 var(--cursor); }
#rank tr.cur td:first-child { box-shadow: inset 2px 2px 0 var(--cursor), inset 0 -2px 0 var(--cursor); }
#rank tr.cur td:last-child { box-shadow: inset -2px 2px 0 var(--cursor), inset 0 -2px 0 var(--cursor); }
#rank tr.sep td { border-top: 2px dashed var(--line); }
.tag { font-size: 10px; border-radius: 3px; padding: 0 3px; margin-left: 3px; border: 1px solid currentColor; }
#right { display: grid; grid-template-rows: auto minmax(260px, 1fr) auto; gap: 12px; min-height: 0; min-width: 0; }
#stockpanel { display: flex; flex-direction: column; min-height: 0; }
#stockhead { padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline;
  border-bottom: 1px solid var(--line); }
#stockhead .nm { font-size: 16px; font-weight: 650; }
#stockhead .meta { color: var(--ink2); font-size: 12px; }
#chartbox { position: relative; flex: 1; min-height: 240px; overflow: hidden; }
#chartbox canvas, #eqbox canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
#tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
  display: none; white-space: nowrap; z-index: 3; font-variant-numeric: tabular-nums; }
#summary { padding: 10px 12px; display: grid; grid-template-columns: minmax(250px, 330px) 1fr; gap: 12px; }
#tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 10px; align-content: start; }
.tile .v { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .b { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile .t { font-size: 11px; color: var(--ink2); }
#expnote { grid-column: 1 / -1; color: var(--ink2); font-size: 12px; }
#eqbox { position: relative; height: 230px; min-width: 0; overflow: hidden; }
#stages { grid-column: 1 / -1; overflow-x: auto; }
#stages table td, #stages table th { padding: 2px 6px; text-align: right; font-size: 11.5px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
#stages table th { color: var(--muted); font-weight: 500; }
#stages td.l, #stages th.l { text-align: left; }
.neg { color: var(--down); } .pos { color: var(--up); }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--muted); pointer-events: none; }
/* touch controls: the keyboard's arrows, Home/End, Enter and L as one button row (phones and tablets) */
#pad { display: none; }
#pad button { flex: 1 1 0; min-width: 0; max-width: 56px; height: 40px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
  font: 600 13px system-ui, sans-serif; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
#pad svg { width: 16px; height: 16px; fill: currentColor; }
#pad svg.st { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#pad button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
#pad .sep { margin-left: 6px; }
@media (max-width: 900px), (pointer: coarse) {
  #pad { flex: none; display: flex; justify-content: center; gap: 4px; padding: 6px 8px;
    position: sticky; bottom: 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line); }
}
@media (max-width: 900px) {
  body { display: block; }
  main { grid-template-columns: 1fr; padding: 12px 16px; }
  #left { max-height: 60vh; }
  #right { grid-template-rows: auto 380px auto; }
  #summary { grid-template-columns: 1fr; }
  .hint { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>台股 LightGBM 排序策略・持股變化</h1>
  <a id="home" href="../">← 研究成果</a>
  <div id="tabs" role="tablist" aria-label="實驗"></div>
  <button id="theme" title="切換深淺色">◐</button>
</header>
<main>
  <section id="left" class="panel">
    <div id="tradehead">
      <div class="date" id="tdate">—</div>
      <div class="sub" id="tsub"></div>
      <div id="legend"></div>
      <div class="hint"><kbd>←</kbd><kbd>→</kbd> 換股日　<kbd>↑</kbd><kbd>↓</kbd> 個股　<kbd>Home</kbd><kbd>End</kbd> 首末　<kbd>Enter</kbd> 放大　<kbd>L</kbd> 對數　<kbd>1</kbd>–<kbd>9</kbd> 實驗</div>
    </div>
    <div id="listwrap">
      <table id="rank">
        <thead><tr><th>#</th><th class="l">代號</th><th class="l">名稱</th><th>分數</th><th>權重</th><th class="l">狀態</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <section id="right">
    <div id="stockpanel" class="panel" style="grid-row: 1 / 3">
      <div id="stockhead"></div>
      <div id="chartbox"><canvas id="chart" aria-label="個股還原股價 K 線與分數"></canvas>
        <div id="tip"></div><div id="loading"></div></div>
    </div>
    <div id="summary" class="panel">
      <div id="tiles"></div>
      <div id="eqbox"><canvas id="eq" aria-label="權益曲線與回檔，和 0050 含息比較"></canvas><div id="tip2" class="tip"></div></div>
      <div id="expnote"></div>
      <div id="stages"></div>
    </div>
  </section>
</main>
<nav id="pad" aria-label="操作">
  <button data-key="Home" aria-label="第一次換股" title="第一次換股（Home）"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="2" height="10"/><path d="M13 3v10L5 8z"/></svg></button>
  <button data-key="ArrowLeft" aria-label="上一次換股" title="上一次換股（←）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12 3v10L4 8z"/></svg></button>
  <button data-key="ArrowUp" aria-label="上一檔" title="上一檔（↑）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 12h10L8 4z"/></svg></button>
  <button data-key="Enter" id="pad-zoom" aria-label="放大或還原" title="放大或還原（Enter）" aria-pressed="false"><svg class="st" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5l-5 5M6.5 13.5h-4v-4M2.5 13.5l5-5"/></svg></button>
  <button data-key="ArrowDown" aria-label="下一檔" title="下一檔（↓）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10L8 12z"/></svg></button>
  <button data-key="ArrowRight" aria-label="下一次換股" title="下一次換股（→）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10l8-5z"/></svg></button>
  <button data-key="End" aria-label="最後一次換股" title="最後一次換股（End）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3v10l8-5z"/><rect x="12" y="3" width="2" height="10"/></svg></button>
  <button data-key="l" id="pad-log" class="sep" aria-label="股價 Y 軸對數或線性" title="對數／線性（L）" aria-pressed="true">log</button>
</nav>
<script>
"use strict";
(() => {
const DATA = "data/";
const DAY = 86400000;
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const S = { meta: null, days: null, exps: {}, exp: null, ti: 0, si: 0, sid: null, zoom: false,
  log: true, px: {}, hover: null, eqHover: null };

// ---------- theme ----------
const THEME_KEY = "twrank-theme";
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
}
try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (e) {}
$("theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.getAttribute("data-theme") || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  drawAll();
};

// ---------- formatting ----------
const fmtD = (i) => { const d = new Date(S.days[i]); return d.toISOString().slice(0, 10); };
const pct = (v, d = 1) => v == null ? "—" : (v * 100).toFixed(d) + "%";
const spct = (v, d = 1) => v == null ? "—" : (v >= 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const num = (v, d = 2) => v == null ? "—" : v.toFixed(d);
// holding time is always counted in calendar weeks (Monday to Sunday) between the two trade days,
// never by rounding days: a trade moved to a Friday by a holiday would otherwise count as an extra week
const weekNo = (ms) => Math.floor((ms / DAY + 3) / 7);  // 1970-01-01 was a Thursday
const weeks = (a, b) => weekNo(S.days[b]) - weekNo(S.days[a]);  // day indices
// compact traded price: 3 significant digits below 100, whole numbers above
const fpx = (p) => p >= 100 ? String(Math.round(p)) : String(+p.toFixed(p >= 10 ? 1 : 2));
const fret = (bp) => { const x = bp / 100; return (x > 0 ? "+" : "") + (Math.abs(x) < 9.95 ? x.toFixed(1) : Math.round(x)) + "%"; };

// ---------- colours for the ranking list ----------
// held: yellow (just added) -> red (held a long time); dropped: deep green -> faint
const HELD = [[0, [247, 205, 70]], [60, [244, 160, 60]], [180, [229, 103, 63]], [365, [200, 50, 45]], [900, [150, 25, 35]]];
function ramp(stops, x) {
  if (x <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) {
    if (x <= stops[i][0]) {
      const [a, ca] = stops[i - 1], [b, cb] = stops[i], f = (x - a) / (b - a);
      return ca.map((c, k) => Math.round(c + (cb[k] - c) * f));
    }
  }
  return stops[stops.length - 1][1];
}
const DROP_FADE = 365;
function rowStyle(st) {
  if (st.held) {
    const c = ramp(HELD, st.heldDays);
    const lum = (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
    return `background: rgb(${c}); color: ${lum > 0.55 ? "#1b1b19" : "#fff"}`;
  }
  if (st.droppedDays != null && st.droppedDays <= DROP_FADE) {
    const a = 0.85 * Math.pow(1 - st.droppedDays / DROP_FADE, 1.3) + 0.06;
    return `background: rgba(26, 140, 75, ${a.toFixed(3)}); color: ${a > 0.5 ? "#fff" : "inherit"}`;
  }
  return "";
}

// ---------- data loading ----------
async function getJSON(p) {
  const r = await fetch(DATA + p);
  if (!r.ok) throw new Error(p + " " + r.status);
  return r.json();
}
async function loadExp(id) {
  if (!S.exps[id]) S.exps[id] = await getJSON("exp/" + id + ".json");
  return S.exps[id];
}
function loadPx(sid) {
  // always a promise: once decoded, S.px[sid] holds the arrays themselves (prefetch chains .catch)
  if (S.px[sid]) return Promise.resolve(S.px[sid]);
  S.px[sid] = (async () => {
    const r = await fetch(DATA + "px/" + sid + ".bin");
    if (!r.ok) throw new Error("px " + sid);
    const ds = new DecompressionStream("deflate");
    const buf = await new Response(r.body.pipeThrough(ds)).arrayBuffer();
    const n = S.days.length;
    const i16 = new Int16Array(buf, 0, 4 * n);
    const u8 = new Uint8Array(buf, 8 * n, 3 * n);
    const C = new Float64Array(n), O = new Float64Array(n), H = new Float64Array(n), L = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const c = i16[i];
      if (c === -32768) { C[i] = O[i] = H[i] = L[i] = NaN; continue; }
      C[i] = Math.exp(c * 0.001);
      O[i] = Math.exp((c + i16[n + i]) * 0.001);
      H[i] = Math.exp((c + i16[2 * n + i]) * 0.001);
      L[i] = Math.exp((c + i16[3 * n + i]) * 0.001);
    }
    const sc = {};
    ["ens", "s21", "s63"].forEach((k, j) => {
      const a = new Float32Array(n);
      for (let i = 0; i < n; i++) { const v = u8[j * n + i]; a[i] = v === 255 ? NaN : v / 2; }
      sc[k] = a;
    });
    return { C, O, H, L, sc };
  })();
  return S.px[sid];
}

// ---------- state helpers ----------
const trade = () => S.exp.trades[S.ti];
function rowsOf(t) {
  // rows dropped on this trade carry the round trip: traded buy and sell open, dividend-inclusive return (bp)
  return t.r.map((r, k) => ({ sid: r[0], p: r[1], w: r[2], hs: r[3], da: r[4], k,
    trip: r.length > 5 ? { bp: r[5], sp: r[6], ret: r[7] } : null }));
}
function statusOf(row, t) {
  const day = S.days[t.d];
  const st = { held: row.hs >= 0, heldDays: 0, heldWeeks: 0, droppedDays: null, droppedWeeks: null, added: false, dropped: false };
  if (st.held) {
    const t0 = S.exp.trades[row.hs];
    st.heldDays = Math.round((day - S.days[t0.d]) / DAY);
    st.heldWeeks = weeks(t0.d, t.d);
    st.added = row.hs === S.ti;
  } else if (row.da >= 0) {
    const t1 = S.exp.trades[row.da];
    st.droppedDays = Math.round((day - S.days[t1.d]) / DAY);
    st.droppedWeeks = weeks(t1.d, t.d);
    st.dropped = row.da === S.ti;
  }
  return st;
}
// the trade a just-dropped row was bought on: its holding start on the previous trade
function boughtAt(sid) {
  const prev = S.exp.trades[S.ti - 1];
  const r = prev && prev.r.find((x) => x[0] === sid);
  return r && r[3] >= 0 ? S.exp.trades[r[3]] : null;
}
// a missing sell price means the stock did not trade that day (halted or no volume): it could not be sold yet
function tripShort(row) {
  const x = row.trip; if (!x) return "本次汰除";
  return `${x.bp == null ? "—" : fpx(x.bp)}→${x.sp == null ? "未成交" : fpx(x.sp)}${x.ret == null ? "" : " " + fret(x.ret)}`;
}
function tripLong(row) {  // the dates and prices; callers name the state where it is not shown green
  const x = row.trip; if (!x) return "";
  const b = boughtAt(row.sid), t = trade();
  const buy = `${b ? fmtD(b.d) + " " : ""}開盤買 ${x.bp == null ? "（缺資料）" : x.bp}`;
  if (x.sp == null) return `${buy}；${fmtD(t.d)} 沒有成交（停牌或無量），要等之後有成交才賣得掉`;
  return `${buy} → ${fmtD(t.d)} 開盤賣 ${x.sp}` +
    `${b ? `，持有 ${weeks(b.d, t.d)} 週` : ""}${x.ret == null ? "" : `，含息報酬 ${fret(x.ret)}`}（未扣成本）`;
}
function nextTradeDay(ti) {
  const t = S.exp.trades[ti + 1];
  return t ? t.d : S.days.length - 1;
}
function heldRuns(sid) {
  // [start day index, end day index) of every stretch this experiment held sid
  const runs = []; let a = null;
  S.exp.trades.forEach((t, i) => {
    const h = t.r.some((r) => r[0] === sid && r[3] >= 0);
    if (h && a == null) a = t.d;
    if (!h && a != null) { runs.push([a, t.d]); a = null; }
  });
  if (a != null) runs.push([a, S.days.length - 1]);
  return runs;
}

// ---------- rendering: list ----------
function renderTradeHead() {
  const t = trade();
  $("tdate").textContent = fmtD(t.d);
  const held = t.r.filter((r) => r[3] >= 0).length;
  const added = t.r.filter((r) => r[3] === S.ti).length;
  const dropped = t.r.filter((r) => r[4] === S.ti).length;
  $("tsub").innerHTML = `第 ${S.ti + 1} / ${S.exp.trades.length} 次換股・候選 ${t.n} 檔・持股 ${held} 檔` +
    `（新進 ${added}、汰除 ${dropped}）・總曝險 <b>${Math.round(t.x * 100)}%</b>`;
}
function renderLegend() {
  const g = (stops) => "linear-gradient(90deg," + stops.map(([x, c]) => `rgb(${c}) ${Math.min(100, x / 9)}%`).join(",") + ")";
  $("legend").innerHTML =
    `<span><i style="background:${g(HELD)}"></i>持有：剛選入 → 持有愈久愈紅</span>` +
    `<span><i style="background:linear-gradient(90deg, rgba(26,140,75,.9), rgba(26,140,75,.06))"></i>剔除：剛剔除（買價→賣價 含息報酬）→ 一年後淡出</span>`;
}
function renderList() {
  const t = trade();
  const rows = rowsOf(t);
  const tb = document.querySelector("#rank tbody");
  let html = "";
  rows.forEach((r, i) => {
    const st = statusOf(r, t);
    const name = S.meta.names[r.sid] || "";
    let stat = "", tip = "";
    if (st.held) stat = st.added ? "新進" : `持有 ${st.heldWeeks} 週`;
    else if (st.droppedDays != null) {

}

const EQ = {};
function renderEq() {
  const cv = $("eq"); const { g, W, H } = setup(cv); g.clearRect(0, 0, W, H);
  const c = S.exp.curve, n = c.nav.length, d0 = c.d0;
  const P = { l: 6, r: 46, t: 8, b: 18 }, gap = 10;
  const h1 = (H - P.t - P.b - gap) * 0.66, h2 = H - P.t - P.b - gap - h1, pw = W - P.l - P.r;

  g.textAlign = "left"; g.textBaseline = "middle";
  for (const v of logTicks(Math.exp(la), Math.exp(lb))) { const y = Math.round(Y(v)) + 0.5; g.beginPath(); g.moveTo(P.l, y); g.lineTo(P.l + pw, y); g.stroke(); g.fillText(v + "×", P.l + pw + 4, y); }
  for (const v of niceTicks(ddMin, 0, 3)) { const y = Math.round(Y2(v)) + 0.5; g.beginPath(); g.moveTo(P.l, y); g.lineTo(P.l + pw, y); g.stroke(); g.fillText((v * 100).toFixed(0) + "%", P.l + pw + 4, y); }
  // years
  g.textAlign = "center"; g.textBaseline = "top"; let ly = -1;
  for (let i = 0; i < n; i++) { const y = new Date(S.days[d0 + i]).getUTCFullYear(); if (y !== ly && i > 0 && y % 2 === 0) g.fillText(String(y), X(i), H - P.b + 4); ly = y; }
  const line = (arr, f, col, dash, w) => { g.strokeStyle = col; g.lineWidth = w; g.setLineDash(dash); g.beginPath(); arr.forEach((v, i) => i ? g.lineTo(X(i), f(v)) : g.moveTo(X(i), f(v))); g.stroke(); g.setLineDash([]); };

  line(c.nav, Y, css("--accent"), [], 1.8);
  line(bdd, Y2, css("--bench"), [4, 3], 1.2);
  line(sdd, Y2, css("--accent"), [], 1.4);
  // current trade marker
  const ti = trade().d - d0;
  if (ti >= 0 && ti < n) { g.strokeStyle = css("--ink2"); g.setLineDash([3, 3]); g.beginPath(); g.moveTo(X(ti), P.t); g.lineTo(X(ti), H - P.b); g.stroke(); g.setLineDash([]); }
  // legend
  g.textAlign = "left"; g.textBaseline = "top"; g.font = "11px system-ui, sans-serif";
  g.fillStyle = css("--accent"); g.fillRect(P.l + 6, P.t + 5, 14, 2.5); g.fillStyle = css("--ink2"); g.fillText(S.exp.label + "（扣成本）", P.l + 24, P.t);
  g.fillStyle = css("--bench"); g.fillRect(P.l + 6, P.t + 21, 14, 2); g.fillStyle = css("--ink2"); g.fillText("0050 含息", P.l + 24, P.t + 16);

    const tx = `${fmtD(d0 + hv)}  策略 ${c.nav[hv].toFixed(2)}×（${pct(sdd[hv])}）  0050 ${c.bench[hv].toFixed(2)}×（${pct(bdd[hv])}）`;

function tradeAtDay(d) {

  else if (k === "End") setTrade(S.exp.trades.length - 1);
  else if (k === "PageDown") setTrade(S.ti + 10);
  else if (k === "PageUp") setTrade(S.ti - 10);
  else if (k === "Enter") { S.zoom = !S.zoom; renderChart(); writeHash(); }
  else if (k === "l" || k === "L") { S.log = !S.log; renderChart(); }
  else if (/^[0-9]$/.test(k)) { const e = S.meta.exps[k === "0" ? 9 : +k - 1]; if (e) setExperiment(e.id); }
  else return false;
  syncPad();
  return true;
}
document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT") return;
  if (act(ev.key)) ev.preventDefault();
});
$("pad").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) act(b.dataset.key); });
document.querySelector("#rank tbody").addEventListener("click", (ev) => {
  const tr = ev.target.closest("tr"); if (tr) selectRow(+tr.dataset.i);
});
$("chart").addEventListener("mousemove", (ev) => {
  if (!CH.X) return;
  const r = ev.currentTarget.getBoundingClientRect(), x = ev.clientX - r.left;
  const i = Math.round(CH.a + ((x - CH.P.l) / CH.pw) * (CH.b - CH.a + 1) - 0.5);
  if (i < CH.a || i > CH.b) { $("tip").style.display = "none"; S.hover = null; renderChart(); return; }
  const bar = CH.bars.find((k) => i >= k.a && i <= k.b) || null;
  S.hover = { x: CH.X(i) }; renderChart();
  const tip = $("tip");
  if (!bar) { tip.style.display = "none"; return; }
  const sc = (CH.px.sc[S.exp.score] || CH.px.sc.ens)[bar.b];
  tip.innerHTML = `${fmtD(bar.a)}${bar.b > bar.a ? " ～ " + fmtD(bar.b) : ""}<br>開 ${fmtP(bar.O)}　高 ${fmtP(bar.H)}　低 ${fmtP(bar.L)}　收 ${fmtP(bar.C)}` +
    (isFinite(sc) ? `<br><span style="color:var(--score)">當日分數 ${sc.toFixed(1)}</span>` : "");
  tip.style.display = "block";
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(x + 14, r.width - tw - 6) + "px"; tip.style.top = "12px";
});
$("chart").addEventListener("mouseleave", () => { $("tip").style.display = "none"; S.hover = null; renderChart(); });
$("eq").addEventListener("mousemove", (ev) => {
  if (!EQ.X) return;
  const r = ev.currentTarget.getBoundingClientRect();
  S.eqHover = Math.round(((ev.clientX - r.left - EQ.P.l) / EQ.pw) * (EQ.n - 1));
  renderEq();
});
$("eq").addEventListener("mouseleave", () => { S.eqHover = null; renderEq(); });
$("eq").addEventListener("click", (ev) => {
  const r = ev.currentTarget.getBoundingClientRect();
  const i = Math.round(((ev.clientX - r.left - EQ.P.l) / EQ.pw) * (EQ.n - 1));
  setTrade(tradeAtDay(EQ.d0 + Math.max(0, i)));
});
window.addEventListener("resize", () => { renderChart(); renderEq(); });

function writeHash() {
  const h = `exp=${S.exp.id}&d=${fmtD(trade().d)}&s=${S.sid || ""}${S.zoom ? "&z=1" : ""}`;
  history.replaceState(null, "", "#" + h);
}
function readHash() {
  const q = new URLSearchParams(location.hash.slice(1));
  return { exp: q.get("exp"), d: q.get("d"), s: q.get("s"), z: q.get("z") === "1" };
}

async function boot() {
  S.meta = await getJSON("meta.json");
  const days = [Date.parse(S.meta.d0 + "T00:00:00Z")];
  for (const d of S.meta.dd) days.push(days[days.length - 1] + d * DAY);
  S.days = days;
  $("tabs").innerHTML = S.meta.exps.map((e, i) => `<button data-id="${e.id}" title="${e.note}">${i < 10 ? `<kbd>${(i + 1) % 10}</kbd>` : ""}${e.label}${(e.tags || []).map((t) => `<span class="tg">${t}</span>`).join("")}</button>`).join("");
  $("tabs").addEventListener("click", (ev) => { const b = ev.target.closest("button"); if (b) setExperiment(b.dataset.id); });
  renderLegend();
  const h = readHash();
  const live = S.meta.exps.find((e) => (e.tags || []).includes("上線")) || S.meta.exps[0];
  const id = S.meta.exps.some((e) => e.id === h.exp) ? h.exp : live.id;
  S.exp = await loadExp(id);
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
  S.ti = S.exp.trades.length - 1;
  if (h.d) { const ms = Date.parse(h.d + "T00:00:00Z"); const di = S.days.findIndex((x) => x >= ms); if (di >= 0) S.ti = tradeAtDay(di); }
  const rows = rowsOf(trade());
  const k = h.s ? rows.findIndex((r) => r.sid === h.s) : -1;
  S.si = k >= 0 ? k : 0; S.sid = rows[S.si]?.sid || null; S.zoom = h.z;
  drawAll(); writeHash(); syncPad(); prefetch();
}
boot().catch((e) => { document.body.insertAdjacentHTML("beforeend", `<p style="padding:16px;color:var(--up)">載入失敗：${e.message}</p>`); });
})();
</script>
</body>
</html>

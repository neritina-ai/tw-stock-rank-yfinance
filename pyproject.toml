[project]
name = "tw-stock-rank-yfinance"
version = "0.1.0"
description = "Taiwan stock LightGBM cross-sectional ranking strategy on public yfinance data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lightgbm>=4.6.0",
    "lxml>=6.0.0",
    "matplotlib>=3.10.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "scipy>=1.15.0",
    "yfinance>=0.2.60",
]

# ---------------------------------------------------------------------------
# Authorship
# ---------------------------------------------------------------------------
# This codebase was designed and written by the AI model:
#     Claude Opus 5.5 (Anthropic), via Claude Code
# ---------------------------------------------------------------------------

[project.scripts]
twrank = "twrank.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twrank"]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
